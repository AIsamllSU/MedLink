spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:hospital_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
